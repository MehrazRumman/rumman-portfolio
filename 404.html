<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Mehraz Hossain Rumman</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <script>
    (function () {
      try { if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
    })();
  </script>
  <!-- Self-contained: GitHub Pages serves this file for any missing path, so it must not depend on relative asset URLs. -->
  <style>
    :root { --bg: #09090b; --text: #ededf0; --text-2: #a1a1aa; --accent: #a78bfa; --accent-2: #22d3ee; --solid-bg: #fff; --solid-fg: #09090b; --dot: rgba(255,255,255,0.07); --glow: rgba(139,92,246,0.35); color-scheme: dark; }
    :root[data-theme="light"] { --bg: #fafafa; --text: #09090b; --text-2: #52525b; --accent: #7c3aed; --accent-2: #0891b2; --solid-bg: #09090b; --solid-fg: #fff; --dot: rgba(9,9,11,0.09); --glow: rgba(124,58,237,0.18); color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center;
      font-family: "Geist", "Inter", system-ui, sans-serif; color: var(--text); background: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 26px 26px; -webkit-font-smoothing: antialiased;
    }
    body::before { content: ""; position: fixed; top: -30vh; right: -20vw; width: 60vw; height: 60vw; border-radius: 50%; filter: blur(80px); background: radial-gradient(circle, var(--glow), transparent 65%); pointer-events: none; }
    main { position: relative; max-width: 34rem; }
    .code { font-family: "Geist Mono", ui-monospace, monospace; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 0.9rem; }
    h1 { font-weight: 600; font-size: clamp(2.4rem, 8vw, 4.2rem); letter-spacing: -0.035em; line-height: 1.05; margin: 0 0 0.9rem; }
    h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--text-2); font-size: 1.05rem; margin: 0 0 2rem; }
    a.btn { display: inline-block; padding: 0.8rem 1.4rem; border-radius: 999px; font-weight: 600; text-decoration: none; background: var(--solid-bg); color: var(--solid-fg); }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Nothing <span>here.</span></h1>
    <p>That page doesn't exist, or it moved.</p>
    <a class="btn" href="/rumman-portfolio/">Back to the portfolio →</a>
  </main>
</body>
</html>
